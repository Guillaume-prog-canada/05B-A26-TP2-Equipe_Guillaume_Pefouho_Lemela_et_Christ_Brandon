<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">

    <!-- Pour s'assurer d'un affichage correct sur mobile -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Styles de Boostrap + Styles personnalisés provenant de styles.scss -->
    <link rel="stylesheet" href="css/styles.css">
    <!-- Nous n'aurons pas besoin de normalize.css, car il existe des styles
    qui font la même chose dans Bootstrap (voir fichier _reboot.scss) -->

    <link rel="icon" href="favicon.ico">
    <title>Recettes Santé</title>
</head>

<body class="d-flex flex-column min-vh-100">


    <main>


<div class="container bg-light p-5">
    
    <div class="row">
        <form class="col-md-6 mx-auto m-5 text-center" method="post"
            action="https://www.formtester.goodbytes.be/post.php">

            <h1 class="text-center">Soumettre une recette </h1>

            <div class="row">

            
                <div class="col-md-6 ">

                    <div class="row align-items-center mb-3">
                        <div class="col-md-3">
                            <label class="form-label" for="nom">Nom: </label>
                        </div>
                        <div class="col-md-9">
                            <input class="form-control" type="text" name="nom" id="nom"
                                required="required" >
                        </div>
                    </div>

                    <div class="row align-items-center mb-3">
                        <div class="col-md-3">
                            <label class="form-label" for="courriel">Courriel: </label>
                        </div>
                        <div class="col-md-9">
                            <input class="form-control" type="email" name="courriel" id="courriel" >
                        </div>
                    </div>

                    <div class="row align-items-center mb-3">
                        <div class="col-md-3">
                            <label class="form-label" for="recette">recette: </label>
                        </div>
                        <div class="col-md-9">
                            <input class="form-control" type="text" name="recette" id="recette" >
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-3">
                            <label class="form-label" for="temps">Duree :</label>
                        </div>
                        <div class="col-md-9">
                            <div class="input-group">
                                <input type="number" class="form-control" name="temps" id="temps">
                                <span class="input-group-text">minutes</span>
                            </div>
                        </div>
                       

                      
                    </div>
                    <div class="row mb-3">
                        <div class="col-md-3">
                            <label class="form-label" for="lst_categorie">Categorie: </label>
                        </div>
                        <div class="col-md-9">
                            <select class="form-select" name="lst_categorie" id="lst_categorie">
                            <option disabled="disabled" selected="selected" value="nil">
                                --- Votre choix ---
                            </option>
                            <option value="cb">Végétarien</option>
                            <option value="al">Viande</option>
                            <option value="sa">Poisson</option>
                            <option value="vegan">Végane</option>
                        </select>
                        </div>

                        
                    </div>

                    <div class="mb-3">
                        <label class="form-label" for="instructions">
                            Instructions supplémentaires :
                        </label>

                        <textarea class="form-control" name="instructions" id="instructions"
                            rows="8"></textarea>
                    </div>

                </div>


          
                <div class="col-md-6">

                    


                    <fieldset class="mb-4">
                        <legend>Type de repas</legend>
                        
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="type"
                                id="type-dejeuner" value="m" >
                            <label class="form-check-label" for="type-dejeuner">
                                Déjeuner
                            </label>
                        </div>

                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="type"
                                id="type-dinner" value="c" >
                            <label class="form-check-label" for="type-dinner">
                                Dîner
                            </label>
                        </div>

                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="type"
                                id="type-souper" value="a" >
                            <label class="form-check-label" for="type-souper">
                                Souper
                            </label>
                        </div>

                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="type"
                                id="type-dessert" value="m" checked="checked" >
                            <label class="form-check-label" for="type-dessert">
                                Dessert
                            </label>
                        </div>
                    </fieldset>


                    <fieldset class="mb-4">
                        <legend>Niveau de Difficulté</legend>

                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="difficulte"
                                id="difficulte_facile" value="f" checked="checked" >
                            <label class="form-check-label" for="difficulte_facile">
                                Facile
                            </label>
                        </div>

                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="difficulte"
                                id="difficulte_moyen" value="m" >
                            <label class="form-check-label" for="difficulte_moyen">
                                Moyen
                            </label>
                        </div>

                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="difficulte"
                                id="difficulte_difficile" value="d" >
                            <label class="form-check-label" for="difficulte_difficile">
                                Difficile
                            </label>
                        </div>
                    </fieldset>


                    <fieldset class="mb-4">
                        <legend>Allergènes</legend>

                        <div class="form-check">
                            <input class="form-check-input" type="checkbox"
                                name="allergenes" id="allergenes-noix" value="noix">
                            <label class="form-check-label" for="allergenes-noix">
                                Noix
                            </label>
                        </div>

                        <div class="form-check">
                            <input class="form-check-input" type="checkbox"
                                name="allergenes" id="allergenes-lait" value="lait">
                            <label class="form-check-label" for="allergenes-lait">
                                Lait
                            </label>
                        </div>

                        <div class="form-check">
                            <input class="form-check-input" type="checkbox"
                                name="allergenes" id="allergenes-oeufs" value="oeufs">
                            <label class="form-check-label" for="allergenes-oeufs">
                                Oeufs
                            </label>
                        </div>

                        <div class="form-check">
                            <input class="form-check-input" type="checkbox"
                                name="allergenes" id="allergenes-gluten" value="gluten">
                            <label class="form-check-label" for="allergenes-gluten">
                                Gluten
                            </label>
                        </div>
                    </fieldset>


                    <!-- Boutons du côté le plus court -->
                    <div class="text-center mt-5">
                        <input type="reset" class="btn btn-primary" >
                        <input type="submit" class="btn btn-primary" >
                    </div>

                </div>

            </div>

        </form>
    </div>
</div>



    </main>








   
     



   
       

        <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
            integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
            crossorigin="anonymous"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
            integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
            crossorigin="anonymous"></script>
     
</body>


</html>
